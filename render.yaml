services:
  - type: web
    name: jeans-around-finance-os
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONIOENCODING
        value: utf-8
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
